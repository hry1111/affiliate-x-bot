<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8f5" />
    <title>コスパモンスター 運用OS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">COST PERFORMANCE MONSTER</p>
        <h1>コスパモンスター 運用OS</h1>
        <p class="header-description">候補選定、需要リサーチ、実体験、記事下書き、公開前チェックを確認待ちで管理します。</p>
        <p id="updated-at" class="updated-at">読み込み中</p>
        <nav class="view-tabs" aria-label="運用画面">
          <button type="button" data-view="candidates" aria-selected="true">投稿候補</button>
          <button type="button" data-view="research">需要リサーチ</button>
          <button type="button" data-view="experiences">実体験</button>
          <button type="button" data-view="articles">記事下書き</button>
          <button type="button" data-view="quality">公開前チェック</button>
        </nav>
        <div class="candidate-filter" data-candidate-only>
          <label for="genre-filter">ジャンル</label>
          <select id="genre-filter" aria-label="表示するジャンル">
            <option value="">すべて</option>
          </select>
        </div>
        <p id="filter-status" class="filter-status" aria-live="polite" data-candidate-only></p>
      </header>
      <section id="candidate-view" class="app-view">
        <section id="candidate-list" class="candidate-list" aria-live="polite"></section>
      </section>
      <section id="research-view" class="app-view" hidden></section>
      <section id="experiences-view" class="app-view" hidden></section>
      <section id="articles-view" class="app-view" hidden></section>
      <section id="quality-view" class="app-view" hidden></section>
    </main>
    <template id="candidate-template">
      <article class="candidate-card">
        <img class="product-image" alt="" />
        <div class="candidate-content">
          <div class="metadata">
            <span class="candidate-kind"></span>
            <span class="genre"></span>
            <span class="post-mode"></span>
          </div>
          <h2 class="product-name"></h2>
          <p class="target"></p>
          <p class="reason"></p>
          <p class="caution"></p>
          <p class="selection-summary" hidden></p>
          <div class="research-summary" hidden></div>
          <div class="source-references"></div>
          <div class="offer-list"></div>
          <div class="post-editor">
            <div class="copy-tabs" role="tablist" aria-label="投稿文案"></div>
            <textarea class="post-text" aria-label="投稿文"></textarea>
            <div class="actions">
              <button class="copy-button" type="button">コピー</button>
              <a class="x-link" target="_blank" rel="noopener">Xを開く</a>
              <button class="hide-button" type="button">見送り</button>
            </div>
          </div>
          <div class="discovery-actions" hidden>
            <p class="discovery-note">比較記事と商品仕様を確認し、投稿可能な商品として登録してから紹介します。</p>
            <button class="copy-config-button" type="button">設定JSONをコピー</button>
            <button class="hide-button" type="button">見送り</button>
          </div>
        </div>
      </article>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
